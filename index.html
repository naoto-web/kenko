<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e9e7e1">
<meta name="robots" content="noindex">
<title>健康管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="健康管理">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <h1 id="pageTitle">健康管理</h1>
  <button id="reloadBtn" class="icon-btn" aria-label="読み直す">↻</button>
</header>

<main>
  <section id="view-home" class="view"><div id="homeBody"></div></section>
  <section id="view-trend" class="view" hidden><div id="trendBody"></div></section>
  <section id="view-food" class="view" hidden><div id="foodBody"></div></section>
  <section id="view-kintore" class="view" hidden><div id="kintoreBody"></div></section>
</main>

<nav class="tabs">
  <button data-tab="home" class="on"><span>🏠</span>ホーム</button>
  <button data-tab="trend"><span>📈</span>推移</button>
  <button data-tab="food"><span>🍚</span>食事</button>
  <button data-tab="kintore"><span>💪</span>筋トレ</button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/chart.js"></script>
<script src="js/home.js"></script>
<script src="js/trend.js"></script>
<script src="js/kintore.js"></script>
<script src="js/food.js"></script>
<script src="js/main.js"></script>
</body>
</html>
